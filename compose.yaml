# docker compose up -d --build   -> starts now and again after every reboot
services:
  airguard-web:
    build: .
    image: airguard-web:1.0
    container_name: airguard-web
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PUBLIC_BASE: "http://192.168.1.10:8787"
      # Telemetry of the ESP32 arrives over MQTT (broker mosquitto on this laptop).
      MQTT_URL: "mqtt://host.docker.internal:1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-airguard}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env (AIRGUARD_MQTT_PASSWORD of the broker)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
