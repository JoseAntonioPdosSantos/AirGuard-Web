# docker compose up -d --build   -> starts now and again after every reboot
services:
  airguard-web:
    build: .
    image: airguard-web:1.0
    container_name: airguard-web
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Address printed in the access links (LAN address of this server), from .env.
      PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:8787}
      # Telemetry of the ESP32 arrives over MQTT (broker on the Docker host).
      MQTT_URL: "mqtt://host.docker.internal:1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-airguard}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env (password of the broker login)}
      # WhatsApp link (page "WhatsApp"): 0 turns it off. WHATSAPP_GROUPS=1 also
      # shows group messages on the AirGuard displays.
      WHATSAPP: ${WHATSAPP:-1}
      WHATSAPP_GROUPS: ${WHATSAPP_GROUPS:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
